PPU-395faa2b9c12c400d03343cad62ce7aad8ec985b:
  "Better depth of field":
    Games:
      "MLB The Show 16":
        BCUS01089: [ 01.10 ]
    Author: "mister"
    Notes: "The depth-of-field blur in close-ups and replays averaged 5 taps about 3 pixels apart, which showed as doubled copies of the background and a halo around in-focus players with resolution scaling. Replaces it with a 17-tap depth-aware blur (2.4 px radius at 720p): in-focus objects no longer bleed into the background. Generated by tools/dof_patch.py."
