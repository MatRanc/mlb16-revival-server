Version: 1.2

PPU-395faa2b9c12c400d03343cad62ce7aad8ec985b:
  "Re-enable online menus (experimental)":
    Games:
      "MLB The Show 16":
        BCUS01089: [ 01.10 ]
    Author: "mister"
    Notes: "Update 1.10 replaced the menu script command TopLevel_VerifyAdvOnlineBranch with one that only shows 'ONLINE DISABLED ... no longer available' and returns 0. This makes it return 1 (continue) with no popup. Needs a private server and RPCN to get anywhere."
    Patch Version: 0.1
    Patch:
      - [ be32, 0x000f0dd4, 0x38600001 ]  # stdu r1,-0xa0(r1) -> li r3, 1
      - [ be32, 0x000f0dd8, 0x4e800020 ]  # mflr r0           -> blr
  "Skip live roster download (online)":
    Games:
      "MLB The Show 16":
        BCUS01089: [ 01.10 ]
    Author: "mister"
    Notes: "Sony's live roster server is gone. Makes the live roster update step (CLiveRosterEngine, 0x23166c) report success right away so everyone keeps the built-in roster. Both players need this patch, or online games will see mismatched rosters."
    Patch Version: 0.1
    Patch:
      - [ be32, 0x0023166c, 0x38600000 ]  # stdu r1,-0x260(r1) -> li r3, 0   (0 = update successful)
      - [ be32, 0x00231670, 0x4e800020 ]  # mflr r0            -> blr
  "Allow game room challenges (online)":
    Games:
      "MLB The Show 16":
        BCUS01089: [ 01.10 ]
    Author: "mister"
    Notes: "The 'challenges can be accepted' flag is never set after a fresh login without Sony's servers, so the Challenge option never appears and incoming challenges are refused. This treats the flag as set in the game room player menu and on accept, and skips the opponent-status check."
    Patch Version: 0.1
    Patch:
      - [ be32, 0x00255c68, 0x38600001 ]  # player menu: lbz r3,0x300(r3) -> li r3,1 (challenges allowed)
      - [ be32, 0x00255ccc, 0x60000000 ]  # player menu: beq cr1 (opponent status not 0/1) -> nop
      - [ be32, 0x001cacc4, 0x38600001 ]  # accept challenge: lbz r3,0x300(r3) -> li r3,1
  "Fix NP ID lookup hang (online)":
    Games:
      "MLB The Show 16":
        BCUS01089: [ 01.10 ]
    Author: "mister"
    Notes: "Before a match the game looks up the opponent's NP ID with sceNpLookupNpIdAsync, then polls sceNpLookupPollAsync. RPCS3 fills the NP ID right away but never completes the transaction, so the poll says busy forever and both players hang on 'Challenge accepted, waiting for a response'. This treats the poll as done so the game moves on to NP Signaling."
    Patch Version: 0.1
    Patch:
      - [ be32, 0x007a9e08, 0x38600000 ]  # bl sceNpLookupPollAsync -> li r3,0 (lookup finished)
      - [ be32, 0x007a9e0c, 0x60000000 ]  # ld r2,0x28(r1) (TOC restore after the stub) -> nop
